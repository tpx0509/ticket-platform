# 工单平台的反向代理配置
#
# 部署方式：文件留在仓库 infra/nginx/ 里，服务器上做两个软链：
#   /etc/nginx/sites-available/ticket-platform.conf  -> 仓库里这个文件
#   /etc/nginx/sites-enabled/ticket-platform.conf    -> 上面那个
# 这样改配置走 git，机器上不需要单独维护一份。
#
# 证书由 certbot 用 webroot 模式签发（不修改本文件），
# 私钥放在 /etc/letsencrypt/live/，不进仓库。

upstream ticket_api {
    # 只有一个后端，keepalive 仍然有意义：nginx 会复用与后端的 TCP 连接，
    # 不用每个请求都重新握手。必须配合下面的 `Connection ""` 才生效。
    server 127.0.0.1:4000;
    keepalive 16;
}

# ==================================================== 80：只做跳转 + 证书验证
#
# 这里不再直接反代。所有业务请求都跳去 https，但 /.well-known/acme-challenge/
# 必须留在 http 上 —— Let's Encrypt 续期时从 80 端口来取验证文件，
# 如果整块 301 掉，90 天后的自动续期会失败，站点直接打不开。
server {
    listen 80;
    listen [::]:80;
    # api 子域写在这里，是为了让它的证书验证（http-01）和跳转都能命中本块。
    # 它是 80 端口上唯一的 server 块，本身就是默认 server，写不写都能用；
    # 但显式写出来，以后再加子域时不会因为「谁是默认」而出现难以排查的 404。
    server_name xin2win.top www.xin2win.top api.xin2win.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        # 301 是永久重定向，浏览器会缓存；$request_uri 带上原始路径和查询串，
        # $host 保留用户实际输入的域名（裸域和 www 各自跳自己，不互相串）
        return 301 https://$host$request_uri;
    }
}

# ==================================================== 443：真正的服务入口
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 起改为独立指令；旧写法 `listen 443 ssl http2` 已弃用会告警
    http2 on;

    server_name xin2win.top www.xin2win.top;

    # 证书链（含中间证书，缺了部分客户端会报"证书不受信任"）和私钥
    ssl_certificate     /etc/letsencrypt/live/xin2win.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xin2win.top/privkey.pem;

    # TLS 参数直接写在配置里，不 include certbot 的 options-ssl-nginx.conf ——
    # 那个文件只在装了 python3-certbot-nginx 插件时才会生成，我们走 webroot 模式
    # 没装它，引用会让 nginx -t 直接失败（部署时踩过这个坑）。
    #
    # 这组参数取 Mozilla 的「中间兼容」档：只留 TLS 1.2 / 1.3，
    # 套件限定前向保密（ECDHE / DHE），兼顾老客户端和安全性。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;   # 让客户端挑套件：服务端偏好会拖慢握手，现代客户端排序已经足够合理

    # 会话复用。TLS 握手要做非对称运算，很贵；缓存住会话，回访用户直接跳过握手，
    # 首字节时间能省几十毫秒。10MB 大约能放 4 万个会话。
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;         # 关掉 ticket，避免密钥轮换导致的历史会话无法解密（老问题，关掉更简单）

    # HSTS：告诉浏览器「这个域名以后只准用 https 访问」，有效期一年。
    # 好处是第一次之后的访问根本不会发出明文请求，杜绝降级攻击。
    # 代价：浏览器记住之后，本地调试 http 会被强制跳转，无法点"继续访问"绕过。
    # 想撤销就删掉这一行，或者把 max-age 改成 0 再加载一次。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传接口限制 10MB（apps/api/src/tickets/attachments.service.ts 的 MAX_UPLOAD_SIZE）。
    # nginx 默认只放行 1MB，不改的话超过 1MB 的附件会被 413 挡在应用之前，
    # 应用里的错误码根本轮不到执行。留 2MB 余量给 multipart 边界和其他表单字段。
    client_max_body_size 12m;

    # ------------------------------------------------------------------ 压缩
    # nginx 默认只压 text/html —— 而这个项目的响应几乎全是 JSON。
    # 一个工单列表响应压缩后通常只剩三分之一，弱网下差别很明显。
    gzip on;
    gzip_comp_level 5;        # 5 是压缩率与 CPU 的平衡点；9 只多压 1~2%，耗时差不多翻倍
    gzip_min_length 1024;     # 小于 1KB 压了反而更大（压缩后还要加 gzip 头）
    gzip_proxied any;         # 后端来的响应也要压，默认只压 nginx 自己产生的
    gzip_vary on;             # 让 CDN / 中间代理按 Accept-Encoding 分开缓存，
                              # 否则压缩版可能发给不支持压缩的客户端，直接乱码
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # ------------------------------------------------------- 前端静态文件根目录
    # 构建产物由部署流程传到这个目录，Nginx 只负责读。
    # 属主设为 ubuntu，SSH 上传时不需要 sudo 提权。
    root /var/www/ticket-web;
    index index.html;

    # ------------------------------------------------------------------ 接口
    # 这里没有 /api/ 反代 —— 接口只由下面的 api.xin2win.top 提供。
    #
    # 之前留过一条兜底，删掉的依据：前端 index.html 是 no-cache，用户下次打开
    # 就会拿到指向 api 子域的新包，不存在「长期卡在旧版本」的情况。
    # 再留一条反代反而是多余入口：同一套接口有两个地址，日志、限流、
    # 以后加的 WAF 规则都得维护两遍，还容易让人分不清哪个才是正式入口。
    #
    # 别为了图省事把它加回来。真要兼容某个客户端，让那个客户端改地址。

    # --------------------------------------------------- 前端：带 hash 的静态资源
    # Vite 产物文件名带内容 hash（index-a1b2c3d4.js），内容一变文件名就变，
    # 可以放心让浏览器缓存一年，永远不会读到旧代码。
    #
    # 注意 add_header 的继承规则：本块一旦出现 add_header，就**不再继承**
    # server 级的 add_header，HSTS 会丢。所以这里把它重写一遍。
    location /assets/ {
        # 只用 add_header，不要同时用 expires：
        # expires 1y 会自己产生 `Cache-Control: max-age=31536000`，
        # 再 add_header 一个 Cache-Control 就会变成两个同名响应头，
        # 浏览器通常只认第一个，immutable 等于没写。
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # 不能用 SPA 兜底：资源真不存在时要明确 404。
        # 回 index.html 会让浏览器拿 HTML 当 JS 解析，报一堆莫名的语法错误。
        try_files $uri =404;
    }

    # ------------------------------------------------------------- 前端：入口页
    # index.html 绝对不能缓存：它记录的是带 hash 的 assets 文件名，
    # 缓存住等于把用户锁死在旧版本，发了新版也看不到。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ------------------------------------------------------------------ 前端路由
    # history 模式下直接访问 /tickets/123，服务器上并没有这个文件。
    # 回落到 index.html 交给 vue-router 渲染，否则一刷新就 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================ 443：API 独立子域
#
# 为什么单独拆一个域：接口有了自己的身份，以后小程序、App、第三方客户端
# 可以直接用它，不受前端页面路径和部署方式的约束 —— 前端哪天换 CDN 或者
# 换成静态托管，接口地址一行都不用改。
#
# 代价是前端和接口从「同源」变成「同站跨源」：
#   - 浏览器会发 CORS 预检（OPTIONS），后端 CORS_ORIGINS 必须含前端地址，
#     漏了就是登录接口 200、页面上所有请求被浏览器拦掉
#   - refresh_token 是 host-only cookie（没设 domain），会绑到 api 这个子域上，
#     仍然能正常带上：SameSite=Lax 判的是「同注册域」，子域算同站
#
# TLS 与代理参数是从上面那块复制的，有意不抽 include：两个块只有几行差异，
# 抽文件会多一个「服务器上还得多做一个软链」的部署步骤，出错概率比重复更大。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api.xin2win.top;

    # 同一张证书：签发时用 --expand 把 api.xin2win.top 加进了 SAN，
    # 不是另签一张（多一张就多一个 90 天后要单独续期的隐患）
    ssl_certificate     /etc/letsencrypt/live/xin2win.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xin2win.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_API:2m;   # 单独一块缓存，不和主站抢容量
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 附件上传也走这个域，12m 必须带上；不写就退回 nginx 默认 1m，
    # 超过 1MB 的附件会在应用之前被 413 挡掉。
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # 整站反代，不保留任何静态托管 —— 这个域只提供接口。
    # proxy_pass 不带 URI，原始路径 /api/v1/... 原样传给后端。
    location / {
        proxy_pass http://ticket_api;
        proxy_http_version 1.1;

        # 这几个头缺任何一个都会出隐性问题：
        #   Host              不透传 → 后端拿到 127.0.0.1:4000，生成的绝对链接和 Cookie 域全错
        #   X-Real-IP / XFF   不透传 → req.ip 全是 127.0.0.1，限流把所有用户算成一个人，
        #                     登录日志里的 IP 也失去排查价值（app.setup.ts 里 trust proxy = 1 依赖它）
        #   X-Forwarded-Proto 不透传 → 后端以为是 http，生成的重定向会掉回明文
        #   Connection ""     配合 upstream keepalive，否则连接复用不生效
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
