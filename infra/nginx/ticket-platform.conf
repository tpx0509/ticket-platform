# 工单平台的反向代理配置
#
# 部署方式：文件留在仓库 infra/nginx/ 里，服务器上做两个软链：
#   /etc/nginx/sites-available/ticket-platform.conf  -> 仓库里这个文件
#   /etc/nginx/sites-enabled/ticket-platform.conf    -> 上面那个
# 这样改配置走 git，机器上不需要单独维护一份。
#
# 上游是本机的 API 容器：docker-compose.yml 把 4000 映射到 127.0.0.1:4000。

upstream ticket_api {
    # 只有一个后端，keepalive 仍然有意义：nginx 会复用与后端的 TCP 连接，
    # 不用每个请求都重新握手。必须配合下面的 `Connection ""` 才生效。
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name xin2win.top www.xin2win.top;

    # 上传接口限制 10MB（apps/api/src/tickets/attachments.service.ts 的 MAX_UPLOAD_SIZE）。
    # nginx 默认只放行 1MB，不改的话超过 1MB 的附件会被 413 挡在应用之前，
    # 应用里的错误码根本轮不到执行。留 2MB 余量给 multipart 边界和其他表单字段。
    client_max_body_size 12m;

    # ------------------------------------------------------------------ 压缩
    # nginx 默认只压 text/html —— 而这个项目的响应几乎全是 JSON。
    # 一个工单列表响应压缩后通常只剩三分之一，弱网下差别很明显。
    gzip on;
    gzip_comp_level 5;        # 5 是压缩率与 CPU 的平衡点；9 只多压 1~2%，耗时差不多翻倍
    gzip_min_length 1024;     # 小于 1KB 压了反而更大（压缩后还要加 gzip 头）
    gzip_proxied any;         # 后端来的响应也要压，默认只压 nginx 自己产生的
    gzip_vary on;             # 让 CDN / 中间代理按 Accept-Encoding 分开缓存，
                              # 否则压缩版可能发给不支持压缩的客户端，直接乱码
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------ 证书验证路径
    # certbot 用 webroot 模式申请 / 续期时，把验证文件写进 /var/www/certbot，
    # Let's Encrypt 会访问 http://域名/.well-known/acme-challenge/<token> 来核对。
    # 必须由 nginx 直接返回静态文件，不能落到反代后面 —— 否则自动续期会失败，
    # 90 天后证书过期，站点直接打不开。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ------------------------------------------------------------------ 反代
    location / {
        proxy_pass http://ticket_api;
        proxy_http_version 1.1;

        # 下面这几个头是反代的标准配置，缺任何一个都会出隐性问题：
        #
        # Host：不透传的话，后端拿到的 Host 是 127.0.0.1:4000，
        #       生成绝对链接、设置 Cookie 域时全错。
        proxy_set_header Host $host;
        # X-Real-IP / X-Forwarded-For：不加的话 req.ip 永远是 127.0.0.1。
        #       rate-limit.guard.ts 会把所有用户当成同一个人（共用一个限流桶），
        #       登录日志里记录的 IP 也全是本机，排查时毫无意义。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto：上 HTTPS 之后必须透传，否则后端以为自己在 http 上，
        #       生成的重定向地址会变成 http://，浏览器报混合内容或死循环跳转。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 空 Connection 配合 upstream keepalive，否则连接复用不生效
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
